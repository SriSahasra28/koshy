<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parabolic SAR Form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .container {
            max-width: 400px;
            margin-top: 50px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4 class="text-center">Parabolic SAR</h4>
        <form>
            <!-- First Group Box -->
            <div class="form-group">
                <label for="acceleration">Acceleration</label>
                <input type="number" class="form-control" id="acceleration" value="0.02" step="0.01">
            </div>
            <div class="form-group">
                <label for="max_acceleration">Max Acceleration</label>
                <input type="number" class="form-control" id="max_acceleration" value="0.2" step="0.1">
            </div>
            <!-- Second Group Box -->
            <div class="form-group">
                <h5>Arrow Signal</h5>
                <div class="d-flex align-items-center mb-3">
                    <i class="fas fa-arrow-up mr-2"></i>
                    <span class="mr-auto">Up</span>
                    <input type="color" class="form-control" value="#00ff00" style="width: 60px;">
                </div>
                <div class="d-flex align-items-center">
                    <i class="fas fa-arrow-down mr-2"></i>
                    <span class="mr-auto">Down</span>
                    <input type="color" class="form-control" value="#ff0000" style="width: 60px;">
                </div>
            </div>
            <!-- Buttons -->
            <div class="form-group text-center">
                <button type="button" class="btn btn-primary">Add</button>
                <button type="button" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
