<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Group Box</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome CSS for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Group 1</span>
      <a href="#" class="btn btn-link">
        <i class="fas fa-edit"></i> Edit
      </a>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <!-- Search text box with Stock Name as placeholder -->
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Stock Name">
            <button class="btn btn-outline-secondary" type="button">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <!-- Checkboxes for CE and PE with space between them -->
          <div class="mb-3 d-flex align-items-center">
            <div class="form-check mr-3">
              <input type="checkbox" class="form-check-input" id="ceCheckbox">
              <label class="form-check-label" for="ceCheckbox">CE</label>
            </div>
            <div class="form-check mr-3" style="margin-left: 10px;">
              <input type="checkbox" class="form-check-input" id="peCheckbox">
              <label class="form-check-label" for="peCheckbox">PE</label>
            </div>
          </div>
          <!-- Button with Add icon -->
          <button type="button" class="btn btn-primary"><i class="fas fa-plus"></i> Add</button>
        </div>
        <div class="col-md-6">
          <!-- Table with sample data and delete icons -->
          <table class="table">
            <thead>
              <tr>
                <th>Stock</th>
                <th>Type</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>TCS</td>
                <td>CE</td>
                <td><button type="button" class="btn btn-outline-secondary btn-sm"><i class="fas fa-times"></i></button></td>
              </tr>
              <tr>
                <td>TCS</td>
                <td>PE</td>
                <td><button type="button" class="btn btn-outline-secondary btn-sm"><i class="fas fa-times"></i></button></td>
              </tr>
              <tr>
                <td>INFY</td>
                <td>CE</td>
                <td><button type="button" class="btn btn-outline-secondary btn-sm"><i class="fas fa-times"></i></button></td>
              </tr>
              <tr>
                <td>INFY</td>
                <td>PE</td>
                <td><button type="button" class="btn btn-outline-secondary btn-sm"><i class="fas fa-times"></i></button></td>
              </tr>
              <!-- Add more rows as needed -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
